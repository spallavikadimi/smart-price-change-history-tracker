
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Smart Price Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <h2>Smart Price Tracker</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Logout</a>
        </nav>
    </header>

    <main class="dashboard">
        <section class="dashboard-heading">
            <h1> Welcome, Price Explorer!</h1>

            <p>Track your products and stay updated on price changes.</p>
        </section>

        <section class="add-product">
            <h2>Track a New Product</h2>

            <form action="add-product" method="post">
                <label for="product-url">Product URL</label>
                <input
                    type="url"
                    id="product-url"
                    name="productUrl"
                    placeholder="Paste product URL here"
                    required
                >

                <label for="target-price">Target Price (₹)</label>
               <input
                   type="number"
                   id="target-price"
                   name="targetPrice"
                   placeholder="Enter your target price"
                   min="0"

                   step="0.01"
                   required
                >

                <button type="submit">Start Tracking</button>
            </form>
        </section>

        <section class="tracked-products">
            <h2>My Tracked Products</h2>
            <div id="product-list"></div>
        </section>

        <section class="price-history">
            <h2>Price History</h2>
            <p>Historical price details will appear here.</p>
        </section>

        <section class="notifications">
            <h2>Price Alerts</h2>
            <p>Your price notifications will appear here.</p>
        </section>

    </main>

    <script>
    if (window.location.search.includes("added=true")) {
        alert("Product added to your tracked list!");
    }
</script>
<script>
fetch("my-products")
.then(response => response.json())
.then(products => {
    let list = document.getElementById("product-list");

    products.forEach(p => {
       list.innerHTML += "<p><b>" + p.productName + "</b><br>" +
    p.productUrl +
    "<br>Current Price: ₹" + p.currentP
    rice +
    "<br>Target Price: ₹" + p.targetPrice + "</p>";
    });
});
</script>
 

</body>
</html>
